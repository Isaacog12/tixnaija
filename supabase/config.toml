# Anonymous by design (guests have no account/session). Each of these does its
# own authorization internally, so the gateway must not demand a user JWT.
# redeploy after changing: npx supabase functions deploy <name>

# Guest checkout: userId is optional in the payload; self-authorizes with a JWT
# when metadata.userId is present, and is IP rate limited otherwise.
[functions.initialize-payment]
enabled = true
verify_jwt = false
entrypoint = "./functions/initialize-payment/index.ts"

# "I lost my email" recovery for guests: rate limited per IP and per email.
[functions.resend-ticket-links]
enabled = true
verify_jwt = false
entrypoint = "./functions/resend-ticket-links/index.ts"

# Cron only: authenticates with CRON_SECRET / x-cron-secret, no user session.
[functions.purge-kyc-files]
enabled = true
verify_jwt = false
entrypoint = "./functions/purge-kyc-files/index.ts"

# Ticket delivery is transactional. Both functions are called directly from the
# browser (signed-in buyers, and guests with no session), so the JWT gate stays
# off and authorization is enforced inside the function instead.
[functions.send-ticket-confirmation]
enabled = true
verify_jwt = false
entrypoint = "./functions/send-ticket-confirmation/index.ts"

# Public by design: the site-wide assistant answers guests as well as signed-in
# users, so the gateway must not demand a JWT. Rate limiting and escalation
# caps are enforced inside the function.
[functions.support-bot]
enabled = true
verify_jwt = false
entrypoint = "./functions/support-bot/index.ts"

[functions.inbound-support-email]
enabled = true
verify_jwt = false
# Shared secret required in the x-inbound-secret header (INBOUND_EMAIL_SECRET).
entrypoint = "./functions/inbound-support-email/index.ts"
