<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1920, height=1080" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      :root {
        --bg: oklch(0.14 0.02 40);
        --fg: oklch(0.97 0.02 80);
        --primary: oklch(0.66 0.22 40);
        --accent: oklch(0.85 0.15 85);
        --card: oklch(0.18 0.03 40);
        --border: oklch(0.25 0.02 40);
        --gradient-sunset: linear-gradient(135deg, oklch(0.75 0.18 50) 0%, oklch(0.66 0.22 40) 50%, oklch(0.5 0.24 15) 100%);
      }
      html, body {
        width: 1920px;
        height: 1080px;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: 'Inter', sans-serif;
      }
      #root {
        width: 100%;
        height: 100%;
        position: relative;
      }
      .clip {
        position: absolute;
        top: 0; left: 0; right: 0; bottom: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-direction: column;
        opacity: 0;
      }
      .font-display {
        font-family: 'Cinzel', serif;
        letter-spacing: -0.02em;
      }
      
      /* Scene 1 */
      .hook-text {
        font-size: 140px;
        font-weight: 700;
        line-height: 1.1;
        text-align: center;
      }
      .gradient-text {
        background-image: var(--gradient-sunset);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        display: inline-block;
      }

      /* Scene 2 */
      .search-bar {
        display: flex;
        align-items: center;
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid var(--border);
        border-radius: 100px;
        padding: 12px 12px 12px 32px;
        width: 1000px;
        box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        backdrop-filter: blur(24px);
      }
      .search-input {
        flex: 1;
        font-size: 32px;
        color: rgba(255,255,255,0.5);
        font-family: 'Inter', sans-serif;
      }
      .search-btn {
        background: var(--gradient-sunset);
        color: #fff;
        padding: 24px 48px;
        border-radius: 100px;
        font-size: 28px;
        font-weight: 700;
        box-shadow: 0 0 28px -6px color-mix(in oklch, var(--primary) 60%, transparent);
        position: relative;
        overflow: hidden;
      }
      .cursor {
        position: absolute;
        width: 48px; height: 48px;
        background: url('data:image/svg+xml;utf8,<svg viewBox="0 0 24 24" fill="white" xmlns="http://www.w3.org/2000/svg"><path d="M7 2l12 11.2h-5.8l3.3 7.3-2.2.9-3.2-7.4-4.4 4.7z"/></svg>') no-repeat;
        z-index: 10;
        top: 600px; left: 800px;
      }

      /* Scene 3 */
      .bento-grid {
        display: flex;
        gap: 32px;
        padding: 40px;
      }
      .bento-card {
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 48px;
        width: 450px;
        height: 450px;
        padding: 48px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      }
      .bento-icon {
        width: 80px; height: 80px;
        background: rgba(255,255,255,0.05);
        border-radius: 24px;
        margin-bottom: 40px;
        border: 2px solid rgba(255,255,255,0.1);
      }
      .bento-title {
        font-size: 42px;
        font-weight: 600;
        margin-bottom: 16px;
      }

      /* Scene 4 */
      .event-card {
        width: 600px;
        height: 800px;
        background: var(--card);
        border: 2px solid var(--border);
        border-radius: 48px;
        overflow: hidden;
        position: relative;
        box-shadow: 0 40px 80px rgba(0,0,0,0.6);
      }
      .event-cover {
        width: 100%; height: 60%;
        background: linear-gradient(to bottom, #333, #111);
        position: relative;
      }
      .event-date {
        position: absolute;
        top: 32px; right: 32px;
        background: rgba(255,255,255,0.1);
        backdrop-filter: blur(12px);
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 24px;
        width: 100px; height: 120px;
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      .event-body {
        padding: 48px;
      }

      /* Scene 5 */
      .outro-text {
        font-size: 64px;
        font-weight: 500;
        text-align: center;
        max-width: 1200px;
        line-height: 1.3;
      }
      .logo {
        font-size: 100px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="20"
      data-width="1920"
      data-height="1080"
    >
      <!-- Scene 1: 0 to 4 -->
      <div id="scene1" class="clip font-display hook-text" data-start="0" data-duration="4" data-track-index="1">
        <div id="hook-line1">Buy tickets.</div>
        <div id="hook-line2" class="gradient-text" style="margin-top: 24px;">Turn up.</div>
      </div>

      <!-- Scene 2: 4 to 8 -->
      <div id="scene2" class="clip" data-start="4" data-duration="4" data-track-index="1">
        <div class="search-bar" id="search-bar">
          <div class="search-input">Search for events, artists, venues...</div>
          <div class="search-btn" id="search-btn">Find Events</div>
        </div>
        <div class="cursor" id="cursor"></div>
      </div>

      <!-- Scene 3: 8 to 14 -->
      <div id="scene3" class="clip" data-start="8" data-duration="6" data-track-index="1">
        <div class="bento-grid">
          <div class="bento-card" id="card1">
            <div class="bento-icon"></div>
            <div class="bento-title font-display">QR tickets,<br/>zero drama</div>
          </div>
          <div class="bento-card" id="card2">
            <div class="bento-icon" style="border-color: var(--accent);"></div>
            <div class="bento-title font-display">Pay with<br/>ease</div>
          </div>
          <div class="bento-card" id="card3">
            <div class="bento-icon"></div>
            <div class="bento-title font-display">Sell in<br/>minutes</div>
          </div>
        </div>
      </div>

      <!-- Scene 4: 14 to 17 -->
      <div id="scene4" class="clip" data-start="14" data-duration="3" data-track-index="1">
        <div class="event-card" id="event-card">
          <div class="event-cover">
            <div class="event-date">
              <span style="font-size: 20px; font-weight: 700; color: #aaa;">DEC</span>
              <span class="font-display" style="font-size: 42px; font-weight: 700;">12</span>
            </div>
          </div>
          <div class="event-body">
            <div class="font-display" style="font-size: 48px; font-weight: 700; margin-bottom: 16px;">TixNaija Fest 2026</div>
            <div style="font-size: 24px; color: #888;">Eko Convention Center, Lagos</div>
          </div>
        </div>
      </div>

      <!-- Scene 5: 17 to 20 -->
      <div id="scene5" class="clip" data-start="17" data-duration="3" data-track-index="1">
        <div id="outro-phrase" class="outro-text">Selling out has never been this ridiculously easy.</div>
        <div id="outro-logo" class="font-display logo gradient-text" style="position: absolute;">TixNaija</div>
      </div>
    </div>

    <script>
      const tl = gsap.timeline({ paused: true });
      window.__timelines = window.__timelines || {};
      window.__timelines["main"] = tl;

      // ──────────────────────────────────────────────
      // SCENE 1 (0s to 4s)
      // ──────────────────────────────────────────────
      tl.set("#scene1", { opacity: 1 }, 0);
      tl.fromTo("#hook-line1", 
        { opacity: 0, y: 40 }, 
        { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 
        0.5
      );
      // Turn up drops at 2.0
      tl.fromTo("#hook-line2", 
        { opacity: 0, y: 40, scale: 0.95 }, 
        { opacity: 1, y: 0, scale: 1, duration: 1, ease: "power3.out" }, 
        2.0
      );
      tl.to("#scene1", { opacity: 0, duration: 0.5 }, 3.5);

      // ──────────────────────────────────────────────
      // SCENE 2 (4s to 8s)
      // ──────────────────────────────────────────────
      tl.set("#scene2", { opacity: 1 }, 4);
      tl.fromTo("#search-bar", 
        { opacity: 0, y: 60 }, 
        { opacity: 1, y: 0, duration: 1, ease: "power3.out" }, 
        4.2
      );
      // Cursor moves and clicks
      tl.fromTo("#cursor", 
        { x: -200, y: 200, opacity: 0 }, 
        { x: 350, y: 30, opacity: 1, duration: 1.2, ease: "power2.inOut" }, 
        4.5
      );
      tl.to("#search-btn", { scale: 0.95, duration: 0.1 }, 5.7);
      tl.to("#search-btn", { scale: 1, boxShadow: "0 0 60px -6px oklch(0.66 0.22 40)", duration: 0.2 }, 5.8);
      tl.to("#scene2", { opacity: 0, duration: 0.5 }, 7.5);

      // ──────────────────────────────────────────────
      // SCENE 3 (8s to 14s)
      // ──────────────────────────────────────────────
      tl.set("#scene3", { opacity: 1 }, 8);
      
      tl.fromTo("#card1", 
        { opacity: 0, y: 100, rotation: -2 }, 
        { opacity: 1, y: 0, rotation: 0, duration: 1, ease: "back.out(1.2)" }, 
        8.5
      );
      tl.fromTo("#card2", 
        { opacity: 0, y: 100, rotation: 2 }, 
        { opacity: 1, y: 0, rotation: 0, duration: 1, ease: "back.out(1.2)" }, 
        9.5
      );
      tl.fromTo("#card3", 
        { opacity: 0, y: 100, rotation: -2 }, 
        { opacity: 1, y: 0, rotation: 0, duration: 1, ease: "back.out(1.2)" }, 
        10.5
      );
      tl.to("#scene3", { opacity: 0, duration: 0.5 }, 13.5);

      // ──────────────────────────────────────────────
      // SCENE 4 (14s to 17s)
      // ──────────────────────────────────────────────
      tl.set("#scene4", { opacity: 1 }, 14);
      tl.fromTo("#event-card", 
        { opacity: 0, scale: 0.9, y: 40 }, 
        { opacity: 1, scale: 1, y: 0, duration: 1.2, ease: "power3.out" }, 
        14.2
      );
      tl.to("#scene4", { opacity: 0, duration: 0.5 }, 16.5);

      // ──────────────────────────────────────────────
      // SCENE 5 (17s to 20s)
      // ──────────────────────────────────────────────
      tl.set("#scene5", { opacity: 1 }, 17);
      tl.set("#outro-logo", { opacity: 0 }, 17);
      
      tl.fromTo("#outro-phrase", 
        { opacity: 0, y: 20 }, 
        { opacity: 1, y: 0, duration: 1, ease: "power2.out" }, 
        17.2
      );
      tl.to("#outro-phrase", { opacity: 0, duration: 0.5 }, 18.5);
      
      tl.fromTo("#outro-logo", 
        { opacity: 0, scale: 0.9, filter: "blur(10px)" }, 
        { opacity: 1, scale: 1, filter: "blur(0px)", duration: 1, ease: "power3.out" }, 
        18.7
      );

      // Lock timeline duration to 20s
      tl.set({}, {}, 20);

      tl.seek(0);
    </script>
  </body>
</html>
